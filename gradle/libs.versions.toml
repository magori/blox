[versions]
# Versions vérifiées le 2026-10-18 (tâche P0.5) : dernières versions stables publiées.
agp = "9.4.1"
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"

androidxActivity = "1.13.0"
androidxNavigation3 = "1.2.0"
# navigationevent suit la version que Navigation 3 embarque (NavDisplay passe par lui pour le retour).
androidxNavigationEvent = "1.2.0"
# lifecycle-viewmodel-navigation3 suit les versions de Lifecycle ; 2.11.0 va avec Navigation 3 1.2.0 (guide de migration).
androidxLifecycle = "2.11.0"
androidxComposeBom = "2026.09.00"
androidxDatastore = "1.2.1"
# Celle que Compose et Lifecycle apportent déjà : la déclarer directement ne la change pas.
androidxAnnotation = "1.11.0"
# Celle que Lifecycle apporte déjà (le SavedStateHandle des ViewModels) : la déclarer directement ne la change pas.
androidxSavedState = "1.4.0"
# Celle qu'Activity et Compose apportent déjà (l'apparence des barres système, lue par SystemBarsAppearanceTest) : la
# déclarer directement ne la change pas.
androidxCore = "1.18.0"
# Okio suit la version que DataStore embarque (datastore-core-okio) : les monter ensemble.
okio = "3.9.1"
# Profil de référence et Macrobenchmark (P5.17), vérifiées le 2026-10-19 : dernières stables. Le plugin
# `androidx.baselineprofile` et `benchmark-macro-junit4` sortent ensemble, d'où une seule version.
# 1.5.0 accepte AGP 8.0 à 9.x (son plafond recommandé est 10.0.0-alpha01) : à revoir avec AGP 10.
androidxBenchmark = "1.5.0"
androidxProfileinstaller = "1.4.1"
androidxUiautomator = "2.4.0"
# Celle que le lanceur d'instrumentation résout déjà : la déclarer ne la change pas.
androidxTestMonitor = "1.8.0"

junit5 = "5.14.4"
# Celle que JUnit 5.14 embarque : `:benchmark` lève son TestAbortedException (RuleExtension).
opentest4j = "1.3.0"
assertj = "3.27.7"
turbine = "1.2.1"
androidJunit = "2.0.2"
androidxEspresso = "3.7.0"
# Compose Preview Screenshot Testing (expérimental). AGP 9.5 le remplace par les « test suites » :
# à revoir en montant AGP (developer.android.com/studio/preview/compose-screenshot-testing).
screenshot = "0.0.1-alpha16"

compileSdk = "37"
targetSdk = "36"
minSdk = "26"
java = "17"

# Moteur ktlint : sa règle `no-unused-imports`, dépréciée, est activée dans `.editorconfig` (P5.55). À chaque
# montée, vérifier qu'un import inutile fait encore échouer `ktlintCheck` ; sinon, la remplacer (detekt `UnusedImports`).
ktlint = "1.8.0"
# Plugin ktlint-gradle : sa sortie en cache cite des chemins absolus (issues #532 et #1041), d'où la
# parade `keepKtlintCacheInsideCheckout` (build-logic, KtlintConfiguration.kt, P5.31). À chaque
# montée du plugin, relancer `scripts/verifier-cache-ktlint.sh` sans la parade : s'il passe, la retirer.
ktlintGradle = "14.2.0"
composeLintChecks = "1.6.1"
dependencyAnalysis = "3.19.2"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "androidxActivity" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "androidxDatastore" }
androidx-datastore-core-okio = { group = "androidx.datastore", name = "datastore-core-okio", version.ref = "androidxDatastore" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "androidxDatastore" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "androidxNavigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "androidxNavigation3" }
androidx-navigationevent = { group = "androidx.navigationevent", name = "navigationevent", version.ref = "androidxNavigationEvent" }
androidx-navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "androidxNavigationEvent" }
androidx-lifecycle-common = { group = "androidx.lifecycle", name = "lifecycle-common", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "androidxProfileinstaller" }
androidx-benchmark-macro = { group = "androidx.benchmark", name = "benchmark-macro", version.ref = "androidxBenchmark" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "androidxUiautomator" }
androidx-test-monitor = { group = "androidx.test", name = "monitor", version.ref = "androidxTestMonitor" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "androidxLifecycle" }
androidx-savedstate = { group = "androidx.savedstate", name = "savedstate", version.ref = "androidxSavedState" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-android = { group = "androidx.compose.ui", name = "ui-test-android" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit5" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
# Lanceur JUnit 5 des tests instrumentés : le plugin android-junit le pose lui-même dans les modules
# application et bibliothèque, pas dans un module `com.android.test` (`:benchmark`, blox.android.benchmark).
android-junit-test-runner = { group = "de.mannodermaus.junit5", name = "android-test-runner", version.ref = "androidJunit" }
# Les extensions Compose de JUnit 5 (ComposeContext) : le plugin android-junit les pose dans androidTest, pas dans
# les testFixtures de core:board, qui les emploient.
android-junit-test-compose = { group = "de.mannodermaus.junit5", name = "android-test-compose", version.ref = "androidJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspresso" }
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "screenshot" }

# Dépendances des plugins de convention (build-logic)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
android-junit-gradlePlugin = { group = "de.mannodermaus.gradle.plugins", name = "android-junit5", version.ref = "androidJunit" }
ktlint-gradlePlugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlintGradle" }
androidx-baselineprofile-gradlePlugin = { group = "androidx.benchmark", name = "benchmark-baseline-profile-gradle-plugin", version.ref = "androidxBenchmark" }
android-compose-screenshot-gradlePlugin = { group = "com.android.compose.screenshot", name = "screenshot-test-gradle-plugin", version.ref = "screenshot" }

# Règles lint supplémentaires
slack-compose-lint-checks = { group = "com.slack.lint.compose", name = "compose-lint-checks", version.ref = "composeLintChecks" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidxBenchmark" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-junit = { id = "de.mannodermaus.android-junit", version.ref = "androidJunit" }
android-compose-screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }

# Plugins de convention définis dans build-logic
blox-android-application = { id = "blox.android.application" }
blox-android-application-compose = { id = "blox.android.application.compose" }
blox-android-library = { id = "blox.android.library" }
blox-android-library-compose = { id = "blox.android.library.compose" }
blox-android-feature = { id = "blox.android.feature" }
blox-android-benchmark = { id = "blox.android.benchmark" }
blox-android-screenshot = { id = "blox.android.screenshot" }
blox-design-tokens = { id = "blox.design.tokens" }
blox-jvm-library = { id = "blox.jvm.library" }
blox-test-fixtures = { id = "blox.test.fixtures" }
