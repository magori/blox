org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Synchronisation Gradle parallèle dans l'IDE (Gradle 9.4+), ajouté par Android Studio
org.gradle.tooling.parallel=true

# Jeu de sources `screenshotTest` (tests de captures, plugin blox.android.screenshot). Le plugin
# Compose Preview Screenshot Testing 0.0.1-alpha16 exige ce drapeau global ET le réglage du module
# (`experimentalProperties`, posé par blox.android.screenshot) : sans l'un ou l'autre, il refuse de
# s'appliquer. Dans les modules Android sans le plugin (app, core:audio, core:data,
# core:designsystem), le drapeau n'ajoute qu'une tâche d'agrégat vide, `assembleScreenshotTest`, sans
# jeu de sources compilé ni avis de buildHealth ; aucun effet dans les modules Kotlin purs.
android.experimental.enableScreenshotTest=true
