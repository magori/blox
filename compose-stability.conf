// Types que le compilateur Compose doit tenir pour stables (P5.9), branché par la convention Compose de
// build-logic (ComposeConfiguration.kt) pour tous les modules Compose.
//
// Les modules Kotlin purs (core:game, core:music) sont compilés sans le plugin Compose : le compilateur
// ne peut pas inférer la stabilité de leurs classes et tient pour instables celles qui ne sont ni des
// énumérations ni des classes valeur (Board, Piece…). Ne lister ici qu'un type réellement immuable :
// toutes ses propriétés publiques en `val`, de types immuables, sans état modifiable exposé. Lister un
// type modifiable serait un bug (Compose sauterait une recomposition due).
//
// Contrat des collections : `Orientation.cells` et `RowsCleared.clearedRows` sont en lecture seule
// (`Set`, `List`) et ne sont jamais modifiées après la construction ; `Board` garde ses cellules privées.
// Un champ d'instance non `final` dans le paquet fait échouer ModelImmutabilityTest (core:game).
//
// Vérifier avec les rapports du compilateur (build/compose-reports/*-classes.txt de chaque module) :
// ./gradlew compileDebugKotlin -Pblox.composeReports=true --rerun
//
// Paquet seul, sans ses sous-paquets (`*`, pas `**`) : value objects du domaine, immuables par
// convention (CLAUDE.md, Immuabilité) et vérifiés un par un.
// `*` ne couvre pas les classes imbriquées (`Cell.Filled`, `Cell.Empty`) : sans effet aujourd'hui.
ch.magori.blox.core.game.model.*
