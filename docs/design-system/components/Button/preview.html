<!-- @dsCard group="Actions" height=200 subtitle="Action principale, bouton secondaire, Jouer" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-body); }
.row { padding: var(--space-6); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
.btn { height: var(--touch-target); min-width: 160px; padding: 0 var(--space-6); box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border-radius: var(--radius-pill); box-shadow: var(--button-gloss); text-decoration: none; cursor: pointer; }
.primary { background: var(--accent); color: var(--accent-ink); border: none; }
.primary:active { background: var(--accent-pressed); }
.btn:active { box-shadow: var(--button-gloss-pressed); transform: translateY(2px); }
.secondary { background: var(--button); color: var(--ink); border: 2px solid var(--button-outline); }
.play { height: 72px; padding: 0 32px; font-size: 22px; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
svg { flex-shrink: 0; }
</style>
</head>
<body>
<div class="row">
<button class="btn primary button-label" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg><span>Reprendre</span></button>
<button class="btn secondary button-label" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"></path></svg><span>Menu</span></button>
<button class="btn primary play button-label" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg><span>Jouer</span></button>
</div>
</body>
</html>
