<!-- @dsCard group="Jeu" height=290 subtitle="Score, niveau, lignes et pièce suivante" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-body); }
.col { width: 112px; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-2); }
.panel { padding: var(--space-1) var(--space-2) var(--space-2); display: flex; flex-direction: column; gap: var(--space-1); background: var(--panel); border: 2px solid var(--panel-border); border-radius: var(--radius-md); }
.stat-label { color: var(--label); text-transform: uppercase; letter-spacing: 0.04em; }
.stat-value { font-variant-numeric: tabular-nums; }
.next { height: 42px; display: flex; align-items: center; justify-content: center; }
.cell { width: 21px; height: 21px; padding: 1px; box-sizing: border-box; }
.cell span { display: block; width: 100%; height: 100%; border-radius: var(--radius-cell); background: linear-gradient(180deg, var(--piece-i-hi) 0%, var(--piece-i) 55%); box-shadow: var(--cell-gloss); }
</style>
</head>
<body>
<div class="col">
<div class="panel"><div class="stat-label">Score</div><div class="stat-value">012340</div></div>
<div class="panel"><div class="stat-label">Niveau</div><div class="stat-value">05</div></div>
<div class="panel"><div class="stat-label">Lignes</div><div class="stat-value">052</div></div>
<div class="panel"><div class="stat-label">Suivante</div><div class="next" role="img" aria-label="Pièce I"><div class="cell"><span></span></div><div class="cell"><span></span></div><div class="cell"><span></span></div><div class="cell"><span></span></div></div></div>
</div>
</body>
</html>
