name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilège : le jeton du workflow ne fait que lire le dépôt. Un job qui a besoin de plus
# (soumission du graphe de dépendances) le déclare lui-même.
permissions:
  contents: read

# Actions épinglées par SHA (le tag en commentaire) : un tag peut être déplacé, pas un commit.
# Dependabot (`github-actions`, .github/dependabot.yml) met à jour le SHA et le commentaire.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Aucune étape ne pousse : le jeton n'est pas laissé dans .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sans JDK ni Gradle : quelques secondes, avant tout le reste.
      - name: Traçabilité règle → test (docs)
        run: bash scripts/verifier-tracabilite.sh

      # setup-gradle valide aussi le wrapper par défaut, mais seulement après l'installation du JDK :
      # cette étape fait échouer un wrapper altéré plus tôt, avant tout téléchargement.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Les vérifications rapides d'abord, pour un retour en quelques secondes.
      - name: Style Kotlin (ktlint)
        run: ./gradlew ktlintCheck && ./gradlew -p build-logic ktlintCheck

      - name: Dépendances déclarées (analyse)
        run: ./gradlew buildHealth

      - name: Tests du domaine (Kotlin pur)
        run: ./gradlew :core:game:test :core:music:test :core:locksmith:test

      - name: Tests unitaires Android
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemblage de l'APK debug
        run: ./gradlew assembleDebug

      # Les PR Dependabot sont fusionnées sur CI verte : la release minifiée (R8, réduction des
      # ressources) doit donc être construite ici. APK non signé ; lance aussi lintVitalRelease.
      - name: Assemblage de l'APK release (R8)
        run: ./gradlew assembleRelease

      # Compile les sources androidTest de tous les modules Android (APK de test), sans les
      # exécuter : il n'y a pas d'émulateur en CI. Compile aussi les tests de captures
      # (src/screenshotTest) : un avertissement Kotlin y est une erreur comme ailleurs (P5.25), et
      # il est signalé ici, avant la comparaison des captures (étape suivante).
      - name: Compilation des tests instrumentés et des tests de captures
        run: ./gradlew assembleDebugAndroidTest compileDebugScreenshotTestKotlin

      # Compare les captures des previews (src/screenshotTest) aux références versionnées, générées
      # sous Windows : une montée de Compose qui change le rendu fait échouer la CI. Le rendu
      # (layoutlib, sur la JVM) est identique au pixel près sous Linux (P5.8 : 42 captures à 0 %) ;
      # tolérance dans AndroidScreenshotConventionPlugin (build-logic). --continue : tous les
      # modules sont comparés même si l'un échoue ; rapports d'écart dans l'artefact `rapports`.
      # Changement voulu : regarder les différences, régénérer avec `updateDebugScreenshotTest`,
      # versionner les PNG ; sinon corriger le code (ou la montée qui a changé le rendu).
      - name: Validation des captures (références Windows)
        run: ./gradlew validateDebugScreenshotTest --continue

      # Compile le module de mesure (Macrobenchmark, générateur du profil de référence) et ses
      # APK de test, sans les exécuter : les mesures et la génération demandent un appareil.
      - name: Compilation des mesures (Macrobenchmark)
        run: ./gradlew :benchmark:assemble

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports
          # Les captures rendues, les différences et l'écart de chacune (diffPercent, résultats JUnit)
          # vivent hors de build/reports : sans eux, un échec de captures ne se diagnostique pas.
          path: |
            **/build/reports/**
            **/build/outputs/screenshotTest-results/**
            **/build/test-results/validateDebugScreenshotTest/**
          if-no-files-found: ignore
          retention-days: 14

  # Graphe des dépendances Gradle envoyé à GitHub (Insights › Dependency graph), pour les alertes
  # Dependabot sur les dépendances transitives. Seulement après une fusion dans main.
  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Le job tient contents: write pendant tout Gradle : le jeton n'est pas laissé dans .git/config.
      # La soumission passe par l'API (jeton de l'action), pas par git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
