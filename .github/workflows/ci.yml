name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Les vérifications rapides d'abord, pour un retour en quelques secondes.
      - name: Style Kotlin (ktlint)
        run: ./gradlew ktlintCheck && ./gradlew -p build-logic ktlintCheck

      - name: Dépendances déclarées (analyse)
        run: ./gradlew buildHealth

      - name: Tests du domaine (Kotlin pur)
        run: ./gradlew :core:game:test :core:music:test

      - name: Tests unitaires Android
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemblage de l'APK debug
        run: ./gradlew assembleDebug
